<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しょうちゃん家 仕込み管理</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:auto;max-width:760px;background:#f5f5f5;color:#222;padding:16px}input,button,select{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;background:white;max-width:100%}button{cursor:pointer}article,section{background:white;padding:14px;border-radius:12px;margin:10px 0}nav{display:flex;gap:6px;flex-wrap:wrap}label{display:block;margin:8px 0}img{max-width:100%}pre{white-space:pre-wrap}dialog{width:95%;max-width:700px;max-height:90vh;border:0;border-radius:12px}#msg{white-space:pre-wrap;color:#a22}input[type=number]{width:130px}</style><h1>しょうちゃん家 仕込み管理</h1><p id="msg"></p><section id="login"><label>メール <input id="email" type="email" autocomplete="username"></label><label>パスワード <input id="pw" type="password" autocomplete="current-password"></label><button id="signin">ログイン</button></section><section id="app" hidden><p id="role"></p><button id="logout">ログアウト</button> <button id="refresh">更新</button><label>作業者 <select id="person"></select></label><nav id="tabs"></nav><label><input id="search" placeholder="仕込み品を検索"></label><main id="main"></main></section><dialog id="dlg"></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,admin=false,rs=[],ss=[],inv=[],logs=[],view='work',busy=false,session=null;const msg=x=>$('msg').textContent=x||'';const date=()=>new Date(Date.now()+3*3600000).toISOString().slice(0,10);const weekend=()=>[5,6].includes(new Date(date()+'T00:00:00Z').getUTCDay());function check(x){if(x.error)throw x.error;return x.data}async function run(fn){if(busy)return;busy=true;msg('');try{await fn()}catch(e){msg(e.message||String(e))}finally{busy=false}}async function load(){let a=await Promise.all([db.from('recipes').select('*').order('name'),db.from('staff').select('*').order('name'),db.from('inventory').select('*'),db.from('prep_logs').select('*').order('started_at',{ascending:false}).limit(500)]);[rs,ss,inv,logs]=a.map(check);let old=$('person').value;$('person').innerHTML='<option value="">選択してください</option>'+ss.filter(s=>s.active).map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('');$('person').value=old;render()}async function enter(s){session=s;let role=s?.user?.app_metadata?.store_role;admin=role==='admin';$('login').hidden=!!s;$('app').hidden=!s;if(!s)return;if(!['admin','staff'].includes(role)){await db.auth.signOut();$('login').hidden=false;$('app').hidden=true;throw Error('店舗の利用権限がありません')} $('role').textContent=admin?'管理者':'スタッフ';$('tabs').innerHTML=[['work','仕込み表'],['recipe','レシピ'],['history','履歴'],...(admin?[['settings','設定']]:[])].map(([v,n])=>`<button onclick="tab('${v}')">${n}</button>`).join('');await load()}function tab(v){view=v;render()}function target(r){return weekend()?r.weekend_target:r.weekday_target}function stock(r){return Number(inv.find(x=>x.recipe_id===r.id)?.quantity||0)}function render(){let h=`<p>営業日 ${date()} / 金・土は週末</p>`;if(view==='settings'&&admin)h+='<article><h2>スタッフ登録</h2><input id="newstaff" placeholder="名前"><button onclick="addStaff()">追加</button><p>'+ss.map(s=>E(s.name)).join('、')+'</p><h2>原本レシピの初回移行</h2><input type="file" id="importfile" accept=".json,.pdf,application/pdf"><button onclick="importRecipes()">取り込む</button><p>元の67ページPDFまたはJSONを選択。既存IDは上書きしません。</p></article>';if(view==='history'){h+=logs.map(l=>`<article>${E(rs.find(r=>r.id===l.recipe_id)?.name)} / ${E(ss.find(s=>s.id===l.staff_id)?.name)} / ${E(l.status)} / ${E(l.quantity)}<p>${E(l.business_date)} ${E(l.completed_at||l.started_at)}</p></article>`).join('');$('main').innerHTML=h;return}for(let r of rs.filter(r=>r.name.includes($('search').value))){let id=r.id,t=target(r),n=stock(r),active=logs.find(l=>l.recipe_id===id&&l.business_date===date()&&l.status==='in_progress');h+=`<article><h2>${E(r.name)}</h2><button onclick="recipe('${id}')">レシピを見る</button>`;if(view==='settings'&&admin)h+=`<label>平日 <input type="number" min="0" id="w${id}" value="${E(r.weekday_target)}"></label><label>週末 <input type="number" min="0" id="e${id}" value="${E(r.weekend_target)}"></label><label>単位 <input id="u${id}" value="${E(r.unit)}"></label><button onclick="settings('${id}')">保存</button>`;if(view==='work'&&r.name!=='資料続き・確認用')h+=`<p>${active?'仕込み中':t==null?'基準未設定':n>=Number(t)?'仕込み不要':'仕込み必要'}</p><label>現在庫 <input type="number" min="0" id="n${id}" value="${n}"> ${E(r.unit)} <button onclick="setStock('${id}')">在庫保存</button></label><p>必要量：${t==null?'未設定':Math.max(0,Number(t)-n)+E(r.unit)}</p>${active?`<button onclick="complete('${active.id}')">完了</button>`:t!=null&&n<Number(t)?`<button onclick="start('${id}')">開始</button>`:''}`;h+='</article>'}$('main').innerHTML=h}function num(v){if(v===''||!Number.isFinite(Number(v))||Number(v)<0)throw Error('正しい数量を入力してください');return Number(v)}function worker(){if(!$('person').value)throw Error('作業者を選択してください');return $('person').value}function setStock(id){run(async()=>{let n=num($('n'+id).value);check(await db.from('inventory').upsert({recipe_id:id,quantity:n,updated_at:new Date().toISOString()}));await load()})}function settings(id){run(async()=>{let val=k=>$(k+id).value===''?null:num($(k+id).value);check(await db.from('recipes').update({weekday_target:val('w'),weekend_target:val('e'),unit:$('u'+id).value}).eq('id',id));await load()})}function addStaff(){run(async()=>{let name=$('newstaff').value.trim();if(!name)throw Error('名前を入力してください');check(await db.from('staff').insert({name,active:true}));await load()})}function start(id){run(async()=>{check(await db.rpc('start_prep_shared',{p_recipe:id,p_staff:worker(),p_day:date()}));await load()})}function complete(id){run(async()=>{let v=prompt('実際の仕込み量');if(v===null)return;let n=num(v);if(n<=0)throw Error('正の数量を入力してください');check(await db.rpc('complete_prep_shared',{p_log:id,p_quantity:n}));await load()})}async function pdfRows(f){msg('PDFを確認中…');const bytes=await f.arrayBuffer();const key=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',bytes),'AES-GCM',false,['decrypt']);const enc=Uint8Array.from(atob('SoIToc4Tbmw53kyXXVcQljznxfbB92JCMYr8alm8yfCqs+odim+cZkHvB9GOTYcdkoJmwJN5XRMCqmKGj2g9gzkqCm2k2idhrvdzTCZuBvqMGQ8A8bQhFyy7NWbCfMQ6VgPr9ir/nUa+Rq6rEiOMqTf6nTnyKD2FcT5F12aIserkxOEGL8DxR/eDmjWwx7QGFyMz7UoPpD7KtQP3ig0bRIcNKLJSVrVfzeEzO0g0kpDTIjo/kS+IrODS9qvvr2UnbcGQ8kaBC87bORvSxiiMir+q0lENqLlAAp9emFYLlpdLBHTWGDvl9cm3N+h5JFjE3XyoMB6wLUBtvBgpAuZ6IdQ8HE/o28FQGldxSimHfq3APBxzp3+sa1E+RyFYwJ3MucRbWKAQwa1XqnyjEjWO7dXkD+6S+jSAegzNcSY9sHgphJAA86CTD8YhevTGT6LPvN6/6gNcTcVF57NegB3idCRy/78YGdqL1gnyiVj0sKVme/YnX6IZlUz9SKUt+eeXuPoLIN8WzBQGzjj63mai2G/gGY7pLcjX7Oos9er1GvpYNbROf2aRFYtvAvk/mOkr72zHQLRhnS7VKh6FgttAx+KkfSnZe5iv3fWPFSLambuFqwAm28vBuaxQJj2BmoTk8wdWQC/HM7HHMtZHqCaIv6mysgd5BrVk3I2IYznPPHfkUE6LXmk55j8QiPDKIY6eWJq5V2QE09zspwRzXhg8Rko1aMoEnxY30ZGK2InCfIlyhoU+SiC7+7xGAnVtfJdNZSzHwqPKnyXEjcm33ojt9cpXP5FlrZpyJ4j4gBtlNFEusLiZA5L2CHnT3PY7/O6pvSq8RqltcXGFTX9V1WoQWCzUiiSMb+fnFh2JFZpdAvE1ikd0Wx4rmVUNWzHbUQMJjNrU/zMA3+wizkSi6Y41XuOz6Bkt32FKZVQFFcfFhSS2P9JubmDPO+KIecrOtqjdZjFPVEK8M5zv37vXei5egxdbGAYsTQGxri8+qgHM28GyC7e2jQp4W22OB7tt5fICppfH3uTYCZ5r65BJvB2gCI9UzmK7HTqnnfEkhy3mAjZ
