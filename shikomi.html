ies(new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));return `${p.year}年${p.month}月${p.day}日 ${p.hour}:${p.minute}`};const multLabel=n=>Number(n)===0.5?'半量':Number(n)===1?'1回分':`${Number(n)}倍`;const taskMult=(t,r)=>{let m=/^\[倍率:([0-9.]+)\]/.exec(t?.note||'');return m&&Number(m[1])>0?Number(m[1]):t&&Number(r.batch_yield)>0&&t.unit===r.unit?Number(t.quantity)/Number(r.batch_yield):null};function taskLabel(t,r){let m=taskMult(t,r);return m===null?`${t.quantity} ${t.unit}`:multLabel(Math.round(m*10000)/10000)}function target(r){return weekend()?r.weekend_target:r.weekday_target}function stock(r){return Number(inv.find(x=>x.recipe_id===r.id)?.quantity||0)}function render(){let h=`<p>営業日 ${date()}</p>`, list=rs.filter(r=>(r.active!==false||view==='work'||(admin&&view==='recipe'))&&r.name.includes($('search').value));let log=id=>logs.find(l=>l.recipe_id===id&&l.business_date===date()&&['in_progress','completed'].includes(l.status));if(view==='work'){let done=tasks.filter(t=>log(t.recipe_id)?.status==='completed').length;h+=`<article><h2>今日の仕込み</h2><p>${done} / ${tasks.length} 完了</p><progress max="${tasks.length||1}" value="${done}"></progress></article>`;if(!tasks.length)h+='<article>本日の仕込み指示はまだありません。</article>';for(let r of list){let t=tasks.find(t=>t.recipe_id===r.id);if(!t)continue;let l=log(r.id),finished=l?.status==='completed';h+=`<article class="task ${finished?'done':''}"><h2>${E(r.name)}</h2><p>${finished?'✓ 完了':l?'仕込み中':'未着手'} ${E(ss.find(s=>s.id===l?.staff_id)?.name||'')}</p><div class="qty">${E(taskLabel(t,r))}</div>${l?.started_at?`<p>開始：${E(fmtDate(l.started_at))}</p>`:''}${finished?`<p>完了：${E(fmtDate(l.completed_at))}</p><p>作業時間：${Math.max(0,Math.round((Date.parse(l.completed_at)-Date.parse(l.started_at))/60000))}分</p>`:''}<p><button onclick="recipe('${r.id}',true)">レシピを見る</button> ${finished?'':l?`<button class="finish" onclick="complete('${l.id}')">仕込み完了</button>`:`<button class="primary" onclick="start('${r.id}')">仕込み開始</button>`}</p></article>`}}else if(view==='assign'){h+='<article><h2>本日の仕込み指示</h2><p>レシピ1回分を基準に倍率を選択します。</p></article>';for(let r of list){let t=tasks.find(t=>t.recipe_id===r.id),l=log(r.id);h+=`<article><h3>${E(r.name)} ${t?'✓ 指示済み':''}</h3><label>仕込み倍率 <select id="q${r.id}">${[0.5,1,1.5,2,3,4].map(m=>`<option value="${m}" ${m===(taskMult(t,r)??1)?'selected':''}>${multLabel(m)}</option>`).join('')}<option value="custom">任意倍率</option></select></label>${Number(r.batch_yield)>0?'':`<p>1回分の仕上がり量が未設定です。${admin?`<button onclick="editRecipe('${r.id}')">設定する</button>`:'管理者に設定を依頼してください。'}</p>`}${t?`<p>現在：${E(taskLabel(t,r))} / 追加：${E(fmtDate(t.added_at))}</p>`:''} <button class="primary" onclick="assign('${r.id}')" ${l?'disabled':''}>指示する</button> ${admin&&t&&!l?`<button onclick="removeTask('${r.id}')">取消</button>`:''}</article>`}}else if(view==='settings'&&admin){h+='<article><h2>スタッフ登録</h2><input id="newstaff" placeholder="名前"><button onclick="addStaff()">追加</button><p>'+ss.map(s=>E(s.name)).join('、')+'</p><h2>レシピ追加（PDF・JSON）</h2><input type="file" id="importfile" accept=".pdf,.json,application/pdf"><button onclick="importRecipes()">取り込む</button></article>'}else if(view==='expiry'&&admin){h+=expiryHTML()}else if(view==='recipe'){if(admin)h+='<button class="primary" onclick="editRecipe()">＋ 新規レシピ</button>';for(let r of list)h+=`<article><h2>${E(r.name)} ${r.active===false?'（非公開）':''}</h2><button onclick="recipe('${r.id}')">レシピを見る</button> ${admin?`<button onclick="editRecipe('${r.id}')">編集</button>`:''}</article>`}else if(view==='history'){for(let l of logs)h+=`<article>${E(rs.find(r=>r.id===l.recipe_id)?.name)} / ${E(ss.find(s=>s.id===l.staff_id)?.name)} / ${E(l.status)} / ${E(l.quantity)}<p>開始：${E(fmtDate(l.started_at))}<br>完了：${E(fmtDate(l.completed_at))}</p></article>`}$('main').innerHTML=h}function assign(id){run(async()=>{let r=rs.find(x=>x.id===id),v=$('q'+id function importRecipes(){run(async()=>{let f=$('importfile').files[0];if(!f)throw Error('PDFまたはJSONファイルを選択してください');let rows=f.name.toLowerCase().endsWith('.pdf')||f.type==='application/pdf'?await pdfRows(f):JSON.parse(await f.text());if(!Array.isArray(rows))throw Error('不正なファイル');for(let i=0;i<rows.length;i+=3){check(await db.from('recipes').upsert(rows.slice(i,i+3),{onConflict:'id',ignoreDuplicates:true}));msg(`${Math.min(i+3,rows.length)} / ${rows.length}`)}await load();msg('取り込み完了')})}function recipe(id,fromTask=false){let r=rs.find(x=>x.id===id),a=r.ingredients||{},d=$('dlg');d.innerHTML=`<button onclick="$('dlg').close()">閉じる</button><h2>${E(r.name)}</h2><label>倍率 <input id="mult" type="number" min="0.1" step="any" value="${fromTask?(taskMult(tasks.find(t=>t.recipe_id===id),r)??1):1}"></label><div id="calc"></div><p>原本と照合してください。</p>${typeof a.image==='string'&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(a.image)?`<img src="${a.image}">`:''}<pre>${E(r.instructions)}</pre>`;let calc=()=>{$('calc').innerHTML=(a.materials||[]).map(x=>`<p>${E(x[0])}：${E(x[1]!==null&&x[1]!==''&&Number.isFinite(Number(x[1]))?Math.round(Number(x[1])*Number($('mult').value)*100)/100:(x[1]??'原本確認'))}${E(x[2])}</p>`).join('')};$('mult').oninput=calc;calc();d.showModal()}setInterval(()=>{if(session&&view==='work'&&!busy&&!$('dlg').open)run(load)},15000);function due(b){return !b.closed_at&&(!b.expires_at||Date.parse(b.expires_at)<=Date.now()+86400000)&&(!b.review_after||Date.parse(b.review_after)<=Date.now()||Date.parse(b.expires_at)<=Date.now())}function expiryHTML(){return '<article><h2>保存期限・ロット管理</h2><p>残量は実測して更新してください。期限不明の品は確認が必要です。</p></article>'+batches.filter(b=>!b.closed_at).sort((a,b)=>Number(due(b))-Number(due(a))).map(b=>`<article><h3>${E(rs.find(r=>r.id===b.recipe_id)?.name)}</h3><p>${due(b)?'⚠ 要確認':'期限内'} / ${b.expires_at?E(fmtDate(b.expires_at)):'期限未設定'}</p><p>仕込み：${E(fmtDate(b.made_at))}</p><label>実際の残量 <input id="b${b.id}" type="number" min="0" step="any" value=
